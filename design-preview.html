`;

// Each preview runs in its own sandboxed document so its design stays isolated.
function previewRuntime(){
 const root=document.body, ledger=root.classList.contains('ledger');
 let days=7,selected=29,expanded=false,eventFilter='all';
 const counts=[35,48,31,29,54,38,22,40,47,32,28,44,36,55,33,39,25,49,41,34,45,30,26,38,51,34,47,29,56,42];
 const data=counts.map((count,i)=>{const d=new Date(Date.UTC(2026,7,22+i));return {count,day:d.getUTCDate(),month:d.getUTCMonth()+1,screen:i===29?138:Math.round(count*3.28),unlocked:i===29?116:Math.round(count*2.76)};});
 const allEvents=[['14:32:08','unlock','解锁'],['14:32:06','on','亮屏'],['14:18:42','off','熄屏'],['14:06:17','unlock','解锁'],['14:06:15','on','亮屏'],['13:51:09','off','熄屏'],['13:42:11','unlock','解锁'],['13:42:09','on','亮屏'],['13:27:38','off','熄屏'],['13:15:06','unlock','解锁'],['13:15:04','on','亮屏'],['12:56:22','off','熄屏']];
 const formatTime=n=>`${Math.floor(n/60)}h ${String(n%60).padStart(2,'0')}`;
 function render(){
  const item=data[selected];
  document.querySelectorAll('[data-screen-hours]').forEach(el=>el.textContent=Math.floor(item.screen/60));
  document.querySelectorAll('[data-screen-minutes]').forEach(el=>el.textContent=String(item.screen%60).padStart(2,'0'));
  document.querySelectorAll('[data-metric]').forEach(el=>{el.textContent=el.dataset.metric==='unlocks'?item.count:formatTime(item[el.dataset.metric]);});
  document.querySelectorAll('[data-date]').forEach(el=>el.textContent=`2026.${String(item.month).padStart(2,'0')}.${String(item.day).padStart(2,'0')}`);
  document.querySelectorAll('.date').forEach(el=>{const last=el.lastElementChild;if(last&&/^周/.test(last.textContent))last.textContent=['周六','周日','周一','周二','周三','周四','周五'][selected%7];});
  document.querySelectorAll('[data-logdate]').forEach(el=>el.textContent=`${String(item.month).padStart(2,'0')} 月 ${String(item.day).padStart(2,'0')} 日`);
  document.querySelectorAll('[data-range]').forEach(el=>el.setAttribute('aria-pressed',String(Number(el.dataset.range)===days)));
  const start=30-days;
  document.querySelectorAll('.bars').forEach(el=>{el.classList.toggle('month',days===30);el.style.setProperty('--n',days);el.innerHTML=data.slice(start).map((d,j)=>`<button class="bar" data-day="${start+j}" aria-pressed="${selected===start+j}" aria-label="${d.month}月${d.day}日，${d.count}次解锁" title="${d.month}月${d.day}日 · ${d.count} 次解锁"><span class="bar-count">${d.count}</span><span class="bar-fill" style="--height:${d.count/65*84}%"></span><span class="bar-label">${days===7?String(d.month).padStart(2,'0')+'.':''}${String(d.day).padStart(2,'0')}</span></button>`).join('');});
  document.querySelectorAll('.chart-range').forEach(el=>el.textContent=days===7?'09.14 - 09.20':'08.22 - 09.20');
  const list=allEvents.filter(e=>eventFilter==='all'||eventFilter===e[1]);
  document.querySelectorAll('.events').forEach(el=>{el.innerHTML=list.slice(0,expanded?12:5).map((e,i)=>`<li class="event ${e[1]}"><time class="event-time">${selected===29?e[0]:e[0].replace(/^14/,'13')}</time><span class="event-kind"><i class="event-mark"></i>${e[2]}</span><span class="event-code">${{unlock:'UNLOCK',on:'SCREEN_ON',off:'SCREEN_OFF'}[e[1]]}</span>${ledger?'<span class="l-received">'+(selected===29?'14:35:00':'14:05:00')+'</span>':''}</li>`).join('');});
  document.querySelectorAll('[data-more]').forEach(el=>{el.hidden=list.length<=5;el.textContent=expanded?'收起记录':'展开更多记录';el.setAttribute('aria-expanded',String(expanded));});
  document.querySelectorAll('.a-calendar button[data-day]').forEach(el=>el.setAttribute('aria-pressed',String(Number(el.dataset.day)===selected)));
  reportHeight();
 }
 const cal=document.querySelector('.a-calendar');
 if(cal)cal.innerHTML=['一','二','三','四','五','六','日'].map(d=>`<span class="weekday">${d}</span>`).join('')+'<span class="blank"></span>'+Array.from({length:30},(_,i)=>`<button ${i<20?`data-day="${i+10}" aria-pressed="${i===19}"`:'disabled'} aria-label="9月${i+1}日">${i+1}</button>`).join('');
 document.addEventListener('click',e=>{const rangeButton=e.target.closest('[data-range]'),dayButton=e.target.closest('[data-day]'),moreButton=e.target.closest('[data-more]');if(rangeButton){days=Number(rangeButton.dataset.range);if(selected<30-days)selected=29;render();}if(dayButton){selected=Number(dayButton.dataset.day);if(selected<30-days)days=30;expanded=false;render();}if(moreButton){expanded=!expanded;render();}});
 document.addEventListener('click',e=>{const link=e.target.closest('a[href^="#"]');if(!link)return;e.preventDefault();const target=document.getElementById(link.getAttribute('href').slice(1));if(target)parent.postMessage({type:'preview-scroll',top:target.getBoundingClientRect().top+scrollY},'*');});
 document.addEventListener('change',e=>{if(e.target.matches('select')){eventFilter=e.target.value;expanded=false;render();}});
 function reportHeight(){parent.postMessage({type:'preview-height',height:document.body.scrollHeight,theme:document.body.className},'*');}
 new ResizeObserver(reportHeight).observe(document.body);
 render();
}
function updateFavorites(){
 const picked=favorites.includes(active);document.getElementById('pick').setAttribute('aria-pressed',String(picked));document.querySelector('#pick span').textContent=picked?'已收藏':'收藏方案';
 document.getElementById('favorite-status').textContent=favorites.length?'已收藏：'+favorites.map(i=>`${String(i+1).padStart(2,'0')} ${themes[i].name}`).join('、'):'尚未收藏方案';
 document.querySelectorAll('.saved-mark').forEach(el=>el.hidden=!favorites.includes(Number(el.dataset.favorite)));
}
function showTheme(index){
 window.scrollTo(0,0);
 active=index;const t=themes[index];document.querySelectorAll('.theme').forEach((el,i)=>{el.setAttribute('aria-selected',String(i===active));el.tabIndex=i===active?0:-1;});
 document.getElementById('current-label').textContent=t.name;
 const frame=document.getElementById('preview');frame.title=t.name+'预览';frame.style.height='1100px';
 document.getElementById('frame-wrap').setAttribute('aria-labelledby','theme-'+index);
 frame.srcdoc='<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+commonCSS+specificCSS+'</style></head><body class="'+t.key+'">'+document.getElementById('icon-source').outerHTML+layouts[index]()+'<script>('+previewRuntime.toString()+')()<\/script></body></html>';
 updateFavorites();
}
const themeNav=document.querySelector('.themes');
themeNav.innerHTML=themes.map((t,i)=>`<button class="theme" id="theme-${i}" role="tab" aria-selected="${i===0}" aria-controls="frame-wrap" tabindex="${i===0?0:-1}" data-theme="${i}" style="--c:${t.color};--d:${t.secondary}"><span class="theme-num">0${i+1}</span><span class="swatch" aria-hidden="true"></span><span class="theme-name">${t.name}</span><span class="saved-mark" data-favorite="${i}" hidden>♥</span></button>`).join('');
themeNav.addEventListener('click',e=>{const button=e.target.closest('[data-theme]');if(button)showTheme(Number(button.dataset.theme));});
themeNav.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?5:(active+(e.key==='ArrowRight'?1:5))%6;showTheme(next);document.getElementById('theme-'+next).focus();}});
document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{size=button.dataset.size;document.getElementById('frame-wrap').classList.toggle('mobile',size==='mobile');document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));
document.getElementById('pick').addEventListener('click',()=>{favorites=favorites.includes(active)?favorites.filter(i=>i!==active):[...favorites,active].sort();try{localStorage.setItem('screen-design-favorites',JSON.stringify(favorites));}catch{}updateFavorites();});
window.addEventListener('message',e=>{const frame=document.getElementById('preview');if(e.source!==frame.contentWindow)return;if(e.data?.type==='preview-height'&&e.data.theme===themes[active].key&&Number.isFinite(e.data.height))frame.style.height=Math.max(600,Math.min(10000,e.data.height+2))+'px';if(e.data?.type==='preview-scroll'&&Number.isFinite(e.data.top))window.scrollTo({top:frame.getBoundingClientRect().top+scrollY+e.data.top-document.querySelector('.studio').offsetHeight-18,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'});});
showTheme(0);
</script>
