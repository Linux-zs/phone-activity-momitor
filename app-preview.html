fresh-line"><p class="small">${state==='empty'?'尚无统计':'更新于 09-21 09:40:12'}</p><button class="text" data-demo="统计已刷新（示例）">${state==='offline'?'重试读取':'刷新统计'}</button></div></section>${card('采集与同步',`<div class="sync-heading"><h3>${state==='offline'?'等待网络':state==='paused'?'同步已暂停':'同步成功'}</h3><span class="pending">待上传 ${state==='offline'?'12':'0'} 条</span></div><div class="divider"></div><div class="sync-detail"><span>采集截至</span>09-21 09:39:58</div><div class="sync-detail"><span>最近成功同步</span>09-21 09:40:08</div><p class="small">含事件和采集覆盖记录 · 北京时间</p>${state==='offline'?'<p class="small">恢复网络后自动上传，本机积压记录会保留。</p>':''}<button class="primary wide" ${['paused','permission'].includes(state)?'disabled':''} data-demo="已提交任务，等待执行（模拟）">立即同步</button>`)}<button class="outline wide" data-demo="预览不连接实际服务器">打开完整网页 ↗</button>`;
}

if(page==='details')content.innerHTML=`<div>${back}<h2>记录详情</h2><p class="small">服务端统计 · 北京时间</p>${msg}</div>${card('日期','<button class="text" id="date">2026-09-21 · 选择日期</button><div class="row"><button class="text" data-demo="前一天：09-20（示例）">‹ 前一天</button><button class="text" disabled style="opacity:.4">后一天 ›</button></div><p>亮屏时长  1 小时 26 分钟</p><p>解锁次数  23</p><p class="small">仅计完整区间；系统仍可能漏记。</p>')}${card('趋势','<p class="control-label">时间范围</p>'+segments(['近 7 天','近 30 天'])+'<p class="control-label">统计指标</p>'+segments(['亮屏时长','解锁次数'])+'<div class="bars" id="trend-bars" role="group" aria-label="每日趋势"></div><p class="chart-range" id="chart-range"></p><div class="chart-selection"><p class="chart-readout" id="chart-readout" aria-live="polite"></p><button class="text" id="trend-prev" aria-label="趋势前一天">‹</button><button class="text" id="trend-next" aria-label="趋势后一天">›</button></div><p class="chart-legend">橙色：选中 / 采集不完整 · 灰线：零 · 灰虚线：缺失</p>')}${card('亮屏时间轴','<p class="small">全天 · 每格 10 分钟</p><div class="timeline"><div class="timeline-track" id="timeline-track" role="slider" tabindex="0" aria-label="选择时间段" aria-valuemin="0" aria-valuemax="143"></div><div class="ruler"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div></div><div class="timeline-selection"><p id="timeline-readout" aria-live="polite"></p><button class="text" id="bin-prev" aria-label="上一时间段">‹</button><button class="text" id="bin-next" aria-label="下一时间段">›</button></div><div class="legend"><span class="active">亮屏</span><span>已采集</span><span class="missing">缺口</span><span class="future">未发生</span></div>')}<h3>事件记录</h3><p class="small">从最近 100 条原始事件中筛选</p>${segments(['全部','解锁','亮屏','熄屏','锁屏'])}<div id="events">${['09:38:21  解锁','09:38:19  亮屏','09:21:02  熄屏','09:21:02  锁屏'].map(e=>`<p class="event">${e}</p>`).join('')}</div>`;if(page==='details')initDetails();}

function initDetails(){
 let range=7,metric=0,selectedDay=29,bin=54;
 const samples=Array.from({length:30},(_,i)=>({date:new Date(Date.UTC(2026,7,23+i)).toISOString().slice(5,10),minutes:i===29?86:70+(i*29)%160,unlocks:12+(i*7)%32,incomplete:i===25}));
 const bars=document.querySelector('#trend-bars'),readout=document.querySelector('#chart-readout');
 function draw(){
  const rows=samples.slice(-range),max=Math.max(...rows.map(p=>metric?p.unlocks:p.minutes));
  bars.classList.toggle('month',range===30);
  bars.innerHTML=rows.map((p,i)=>{const n=30-range+i,v=metric?p.unlocks:p.minutes;
   return `<button class="point ${n===selectedDay?'selected':''} ${p.incomplete?'incomplete':''}" data-day="${n}" aria-pressed="${n===selectedDay}" aria-label="${p.date} ${metric?'解锁 '+v+' 次':'亮屏 '+Math.floor(v/60)+' 小时 '+v%60+' 分钟'}${p.incomplete?'，采集不完整':''}"><div class="plot"><i style="height:${Math.max(3,v/max*80)}px"></i></div></button>`}).join('');
  const p=samples[selectedDay];readout.textContent=selectedDay<30-range?'点选柱条查看日期与数值':p.date+' · '+(metric?'解锁 '+p.unlocks+' 次':'亮屏 '+Math.floor(p.minutes/60)+' 小时 '+p.minutes%60+' 分钟')+(p.incomplete?' · 采集不完整':'');
  document.querySelector('#chart-range').textContent=rows[0].date+' — '+rows[rows.length-1].date;
  document.querySelector('#trend-prev').disabled=selectedDay<=30-range;
  document.querySelector('#trend-next').disabled=selectedDay===29;
 }
 document.querySelector('#trend-prev').onclick=()=>{selectedDay--;draw()};
 document.querySelector('#trend-next').onclick=()=>{selectedDay=selectedDay<30-range?30-range:selectedDay+1;draw()};
 bars.onkeydown=e=>{const target=e.target.closest('[data-day]');if(target&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();selectedDay=e.key==='Home'?30-range:e.key==='End'?29:Math.max(30-range,Math.min(29,Number(target.dataset.day)+(e.key==='ArrowRight'?1:-1)));draw();bars.querySelector(`[data-day="${selectedDay}"]`).focus()}};

 bars.onclick=e=>{const p=e.target.closest('[data-day]');if(p){selectedDay=Number(p.dataset.day);draw()}};
 const groups=bars.parentElement.querySelectorAll('.segments');groups[0].onclick=e=>{const b=e.target.closest('.segment');if(b){range=b.textContent.includes('30')?30:7;draw()}};groups[1].onclick=e=>{const b=e.target.closest('.segment');if(b){metric=b.textContent==='解锁次数'?1:0;draw()}};draw();
 const track=document.querySelector('#timeline-track');
 function binData(i){return i>=59?['future','尚未发生']:i>=22&&i<27?['missing','采集缺口']:i>=49&&i<56?['active','亮屏 10 分钟']:['','亮屏 0 分钟 · 已采集']}
 function selectBin(n){bin=Math.max(0,Math.min(143,n));track.innerHTML=Array.from({length:144},(_,i)=>`<i aria-hidden="true" class="${binData(i)[0]} ${i===bin?'selected':''}"></i>`).join('');const label=String(Math.floor(bin/6)).padStart(2,'0')+':'+String(bin%6*10).padStart(2,'0')+' · '+binData(bin)[1];document.querySelector('#timeline-readout').textContent=label;track.setAttribute('aria-valuenow',bin);track.setAttribute('aria-valuetext',label);document.querySelector('#bin-prev').disabled=bin===0;document.querySelector('#bin-next').disabled=bin===143;}
 track.onclick=e=>selectBin(Math.floor((e.clientX-track.getBoundingClientRect().left)/track.clientWidth*144));track.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();selectBin(e.key==='Home'?0:e.key==='End'?143:bin+(e.key==='ArrowRight'?1:-1))}};document.querySelector('#bin-prev').onclick=()=>selectBin(bin-1);document.querySelector('#bin-next').onclick=()=>selectBin(bin+1);selectBin(bin);
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)render(b.dataset.page);if(b.dataset.demo){let n=b.parentElement.querySelector('.toast');if(!n){n=document.createElement('p');n.className='toast';b.after(n)}n.textContent=b.dataset.demo}if(b.classList.contains('segment')){b.parentElement.querySelectorAll('.segment').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}if(b.classList.contains('palette')){document.querySelector('#phone').dataset.palette=b.dataset.palette;document.querySelectorAll('.palette').forEach(x=>{const active=x===b;x.classList.toggle('active',active);x.setAttribute('aria-pressed',String(active))});document.querySelector('#palette-name').textContent=b.dataset.name}});document.querySelector('#theme').onclick=()=>{const dark=document.querySelector('#phone').classList.toggle('dark');document.querySelector('#theme').textContent=dark?'切换浅色':'切换深色'};document.querySelector('#preview-state').onchange=()=>render('home');render('home');
</script></html>
