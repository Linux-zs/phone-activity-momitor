# Phase 1: ACME validation only. No application or credentials over HTTP.
server {
    listen 80;
    server_name udong.udong.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
