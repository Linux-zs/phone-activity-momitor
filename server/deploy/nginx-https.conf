# Replace this site's phase-1 configuration after installing the certificate.
server {
    listen 80;
    server_name udong.udong.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://udong.udong.top$request_uri; }
}
server {
    listen 443 ssl;
    server_name udong.udong.top;
    ssl_certificate /etc/nginx/ssl/udong.udong.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/udong.udong.top/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;
    location = /healthz { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
